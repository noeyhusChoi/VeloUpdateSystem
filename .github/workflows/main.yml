name: Velopack Release (Private Server)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest

    steps:
    # ------------------------------------------------------------
    # 1. Checkout
    # ------------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ------------------------------------------------------------
    # 2. Extract version & channel from tag
    # ------------------------------------------------------------
    - name: Extract version from tag
      id: version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"

        if ($tag -notmatch '^v\d+\.\d+\.\d+(-beta\.\d+)?$') {
          Write-Error "Invalid tag format: $tag"
          exit 1
        }

        $version = $tag.Substring(1)
        $isBeta = $version -match 'beta'

        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "isBeta=$isBeta" >> $env:GITHUB_OUTPUT

    # ------------------------------------------------------------
    # 3. Setup .NET
    # ------------------------------------------------------------
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # ------------------------------------------------------------
    # 4. Publish WPF
    # ------------------------------------------------------------
    - name: Publish WPF
      shell: pwsh
      run: |
        dotnet publish VeloUpdateSystem/VeloUpdateSystem.csproj `
          -c Release `
          -r win-x64 `
          --self-contained false `
          -o publish `
          /p:Version=${{ steps.version.outputs.version }}

    # ------------------------------------------------------------
    # 5. Install Velopack CLI
    # ------------------------------------------------------------
    - name: Install Velopack
      shell: pwsh
      run: dotnet tool install -g vpk

    # ------------------------------------------------------------
    # 6. Velopack pack
    # ------------------------------------------------------------
    - name: Velopack pack
      shell: pwsh
      run: |
        $channel = if ("${{ steps.version.outputs.isBeta }}" -eq "True") { "beta" } else { "stable" }

        vpk pack `
          --packId VeloUpdateSystem `
          --packVersion ${{ steps.version.outputs.version }} `
          --packDir publish `
          --outputDir artifacts `
          --channel $channel

    # ------------------------------------------------------------
    # 7. Setup SSH (Windows runner + KEX 호환)
    # ------------------------------------------------------------
    - name: Setup SSH
      shell: pwsh
      run: |
        $sshDir = "$env:USERPROFILE\.ssh"
        New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

        # Private key
        Set-Content `
          -Path "$sshDir\id_rsa" `
          -Value "${{ secrets.AZURE_SSH_KEY }}" `
          -NoNewline

        # known_hosts
        ssh-keyscan -H ${{ vars.AZURE_SSH_HOST }} |
          Out-File -Append "$sshDir\known_hosts"

        # Restrict permissions
        icacls "$sshDir\id_rsa" /inheritance:r
        icacls "$sshDir\id_rsa" /grant:r "$($env:USERNAME):(R)"

    # ------------------------------------------------------------
    # 8. Test SSH connection (⭐ KEX 강제 지정)
    # ------------------------------------------------------------
    - name: Test SSH connection
      shell: pwsh
      run: |
        ssh `
          -o KexAlgorithms=curve25519-sha256 `
          ${{ vars.AZURE_SSH_USER }}@${{ vars.AZURE_SSH_HOST }} `
          "echo SSH connection OK"

    # ------------------------------------------------------------
    # 9. Upload artifacts to Azure (staging)
    # ------------------------------------------------------------
    - name: Upload to Azure (staging)
      shell: pwsh
      run: |
        $channel = if ("${{ steps.version.outputs.isBeta }}" -eq "True") { "beta" } else { "stable" }

        rsync -av `
          -e "ssh -o KexAlgorithms=curve25519-sha256" `
          artifacts/ `
          ${{ vars.AZURE_SSH_USER }}@${{ vars.AZURE_SSH_HOST }}:/var/www/velopack/releases/${channel}_staging/

    # ------------------------------------------------------------
    # 10. Atomic deploy (staging → live)
    # ------------------------------------------------------------
    - name: Activate release
      shell: pwsh
      run: |
        $channel = if ("${{ steps.version.outputs.isBeta }}" -eq "True") { "beta" } else { "stable" }

        ssh `
          -o KexAlgorithms=curve25519-sha256 `
          ${{ vars.AZURE_SSH_USER }}@${{ vars.AZURE_SSH_HOST }} `
          "set -e
           rm -rf /var/www/velopack/releases/${channel}_old || true
           mv /var/www/velopack/releases/${channel} /var/www/velopack/releases/${channel}_old || true
           mv /var/www/velopack/releases/${channel}_staging /var/www/velopack/releases/${channel}
           rm -rf /var/www/velopack/releases/${channel}_old"

    # ------------------------------------------------------------
    # 11. Summary
    # ------------------------------------------------------------
    - name: Deployment summary
      shell: pwsh
      run: |
        echo "Deployment complete"
        echo "Version : ${{ steps.version.outputs.version }}"
        echo "Channel : $(if ('${{ steps.version.outputs.isBeta }}' -eq 'True') { 'beta' } else { 'stable' })"
