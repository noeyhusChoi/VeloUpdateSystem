name: Velopack Build & Deploy (Ubuntu)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ------------------------------------------------------------
    # 1. Checkout
    # ------------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ------------------------------------------------------------
    # 2. Extract version & channel from tag
    # ------------------------------------------------------------
    - name: Extract version from tag
      id: version
      run: |
        TAG="${GITHUB_REF_NAME}"

        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
          echo "Invalid tag format: $TAG"
          exit 1
        fi

        VERSION="${TAG#v}"

        if [[ "$VERSION" == *beta* ]]; then
          CHANNEL="beta"
        else
          CHANNEL="stable"
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

    # ------------------------------------------------------------
    # 3. Setup .NET SDK
    # ------------------------------------------------------------
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # ------------------------------------------------------------
    # 4. Publish WPF (win-x64 cross build)
    # ------------------------------------------------------------
    - name: Publish WPF
      run: |
        dotnet publish VeloUpdateSystem/VeloUpdateSystem.csproj \
          -c Release \
          -r win-x64 \
          --self-contained false \
          -o publish \
          /p:Version=${{ steps.version.outputs.version }}

    # ------------------------------------------------------------
    # 5. Install Velopack CLI
    # ------------------------------------------------------------
    - name: Install Velopack
      run: dotnet tool install -g vpk

    # ------------------------------------------------------------
    # 6. Velopack pack
    # ------------------------------------------------------------
    - name: Velopack pack
      run: |
        vpk pack \
          --packId VeloUpdateSystem \
          --packVersion ${{ steps.version.outputs.version }} \
          --packDir publish \
          --outputDir artifacts \
          --channel ${{ steps.version.outputs.channel }}

    # ------------------------------------------------------------
    # 7. Setup SSH (CI 안정 모드)
    # ------------------------------------------------------------
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    # ------------------------------------------------------------
    # 8. Test SSH connection
    # ------------------------------------------------------------
    - name: Test SSH connection
      run: |
        ssh \
          -o StrictHostKeyChecking=no \
          -o KexAlgorithms=curve25519-sha256 \
          ${{ vars.AZURE_SSH_USER }}@${{ vars.AZURE_SSH_HOST }} \
          "echo SSH connection OK"

    # ------------------------------------------------------------
    # 9. Upload artifacts to Azure (staging)
    # ------------------------------------------------------------
    - name: Upload to Azure (staging)
      run: |
        rsync -av \
          -e "ssh -o StrictHostKeyChecking=no -o KexAlgorithms=curve25519-sha256" \
          artifacts/ \
          ${{ vars.AZURE_SSH_USER }}@${{ vars.AZURE_SSH_HOST }}:/var/www/velopack/releases/${{ steps.version.outputs.channel }}_staging/

    # ------------------------------------------------------------
    # 10. Atomic deploy (staging → live)
    # ------------------------------------------------------------
    - name: Activate release
      run: |
        CHANNEL=${{ steps.version.outputs.channel }}

        ssh \
          -o StrictHostKeyChecking=no \
          -o KexAlgorithms=curve25519-sha256 \
          ${{ vars.AZURE_SSH_USER }}@${{ vars.AZURE_SSH_HOST }} \
          "
          set -e
          rm -rf /var/www/velopack/releases/${CHANNEL}_old || true
          mv /var/www/velopack/releases/${CHANNEL} /var/www/velopack/releases/${CHANNEL}_old || true
          mv /var/www/velopack/releases/${CHANNEL}_staging /var/www/velopack/releases/${CHANNEL}
          rm -rf /var/www/velopack/releases/${CHANNEL}_old
          "

    # ------------------------------------------------------------
    # 11. Summary
    # ------------------------------------------------------------
    - name: Deployment summary
      run: |
        echo "Deployment complete"
        echo "Version : ${{ steps.version.outputs.version }}"
        echo "Channel : ${{ steps.version.outputs.channel }}"
