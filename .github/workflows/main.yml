name: Velopack Release (Private Server)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read   # GitHub Release 안 쓰므로 read만

jobs:
  release:
    runs-on: windows-latest

    steps:
    # ------------------------------------------------------------
    # 1. Checkout
    # ------------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ------------------------------------------------------------
    # 2. Extract version & channel
    # ------------------------------------------------------------
    - name: Extract version from tag
      id: version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"

        if ($tag -notmatch '^v\d+\.\d+\.\d+(-beta\.\d+)?$') {
          Write-Error "Invalid tag format: $tag"
          exit 1
        }

        $version = $tag.Substring(1)
        $isBeta = $version -match 'beta'

        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "isBeta=$isBeta" >> $env:GITHUB_OUTPUT

    # ------------------------------------------------------------
    # 3. Setup .NET
    # ------------------------------------------------------------
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # ------------------------------------------------------------
    # 4. Publish WPF (csproj 기준)
    # ------------------------------------------------------------
    - name: Publish WPF
      run: >
        dotnet publish VeloUpdateSystem/VeloUpdateSystem.csproj
        -c Release
        -r win-x64
        --self-contained false
        -o publish
        /p:Version=${{ steps.version.outputs.version }}

    # ------------------------------------------------------------
    # 5. Install Velopack CLI
    # ------------------------------------------------------------
    - name: Install Velopack
      run: dotnet tool install -g vpk

    # ------------------------------------------------------------
    # 6. Velopack pack
    # ------------------------------------------------------------
    - name: Velopack pack
      run: >
        vpk pack
        --packId VeloUpdateSystem
        --packVersion ${{ steps.version.outputs.version }}
        --packDir publish
        --outputDir artifacts
        --channel ${{ steps.version.outputs.isBeta == 'True' && 'beta' || 'stable' }}

    # ------------------------------------------------------------
    # 7. Prepare SSH key
    # ------------------------------------------------------------
    - name: Setup SSH
      shell: pwsh
      run: |
        mkdir ~/.ssh
        echo "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.AZURE_SSH_HOST }} >> ~/.ssh/known_hosts

    # ------------------------------------------------------------
    # 8. Upload to Azure server (staging)
    # ------------------------------------------------------------
    - name: Upload to Azure (staging)
      shell: pwsh
      run: |
        $channel = "${{ steps.version.outputs.isBeta }}" -eq "True" ? "beta" : "stable"

        rsync -av artifacts/ `
          ${{ secrets.AZURE_SSH_USER }}@${{ secrets.AZURE_SSH_HOST }}:/var/www/velopack/releases/${channel}_staging/

    # ------------------------------------------------------------
    # 9. Atomic deploy (staging → live)
    # ------------------------------------------------------------
    - name: Activate release
      shell: pwsh
      run: |
        $channel = "${{ steps.version.outputs.isBeta }}" -eq "True" ? "beta" : "stable"

        ssh ${{ secrets.AZURE_SSH_USER }}@${{ secrets.AZURE_SSH_HOST }} `
          "set -e
           rm -rf /var/www/velopack/releases/${channel}_old || true
           mv /var/www/velopack/releases/${channel} /var/www/velopack/releases/${channel}_old || true
           mv /var/www/velopack/releases/${channel}_staging /var/www/velopack/releases/${channel}
           rm -rf /var/www/velopack/releases/${channel}_old"
           
    # ------------------------------------------------------------
    # 10. Summary
    # ------------------------------------------------------------
    - name: Deployment summary
      run: |
        echo "Deployment complete"
        echo "Version : ${{ steps.version.outputs.version }}"
        echo "Channel : ${{ steps.version.outputs.isBeta == 'True' && 'beta' || 'stable' }}"
